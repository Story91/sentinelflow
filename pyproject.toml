[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "Production-oriented real-time risk scoring platform for AI/MLOps training."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SentinelFlow contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "prometheus-client>=0.20,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
tracking = [
  "mlflow==2.18.0",
]
streaming = [
  "confluent-kafka>=2.3,<3",
]
ml = [
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "mlflow==2.18.0",
  "dvc[s3]>=3.48,<4",
]
data = [
  "pyspark>=3.5,<4",
  "confluent-kafka>=2.3,<3",
]
orchestration = [
  "apache-airflow>=2.8,<3",
  "kfp>=2.5,<3",
]
quality = [
  "pytest>=8,<9",
  "ruff>=0.4,<1",
  "mypy>=1.8,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
sentinelflow = "sentinelflow.cli:main"
sentinelflow-sagemaker = "sentinelflow.sagemaker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["mlflow", "sklearn.*", "xgboost", "torch", "tensorflow"]
ignore_missing_imports = true
follow_imports = "skip"
