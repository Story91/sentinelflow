services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      SENTINELFLOW_MODEL_REGISTRY: /app/model-registry
      SENTINELFLOW_MODEL_NAME: risk-scorer
    ports:
      - "8000:8000"
    volumes:
      - model-registry:/app/model-registry:ro
    depends_on:
      trainer:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  trainer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command:
      - sh
      - -c
      - >-
        sentinelflow generate --output /app/data/transactions.csv --rows 5000 --seed 42 &&
        sentinelflow train --data /app/data/transactions.csv --registry /app/model-registry
    volumes:
      - model-registry:/app/model-registry
      - training-data:/app/data
    restart: "no"

  redpanda:
    image: redpandadata/redpanda:v24.1.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelflow
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: local-only-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/sentinelflow.json:ro
      - ../monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/sentinelflow.yml:ro
      - ../monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/sentinelflow.yml:ro

volumes:
  model-registry:
  training-data:
  postgres-data:
  minio-data:
  grafana-data:
