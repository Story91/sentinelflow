apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelflow-api
  namespace: sentinelflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelflow-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sentinelflow
      ports:
        - protocol: TCP
          port: 5432
