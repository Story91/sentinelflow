apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelflow-api
  namespace: sentinelflow
  labels:
    app.kubernetes.io/name: sentinelflow-api
    app.kubernetes.io/component: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelflow-api
        app.kubernetes.io/component: serving
    spec:
      serviceAccountName: sentinelflow-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/sentinelflow-api:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinelflow-config
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: model-registry
              mountPath: /app/model-registry
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-registry
          persistentVolumeClaim:
            claimName: sentinelflow-model-registry
        - name: tmp
          emptyDir: {}

