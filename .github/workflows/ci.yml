name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality dependencies
        run: python -m pip install -e ".[quality]"
      - name: Lint
        run: ruff check src tests scripts pipelines
      - name: Unit tests
        run: pytest
      - name: Static typing
        run: mypy src
      - name: Compile all Python modules
        run: python -m compileall -q src tests scripts pipelines
      - name: Validate YAML and JSON manifests
        run: python scripts/validate_manifests.py
      - name: Validate Docker Compose
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.elk.yml config --quiet
          docker compose -f infra/mlflow/docker-compose.yml config --quiet

  container:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile
        run: docker build --check -f infra/docker/Dockerfile .
      - name: Build image
        run: docker build -f infra/docker/Dockerfile -t sentinelflow-api:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelflow-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
